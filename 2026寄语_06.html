/* 轻遮罩，仅保证文字可读 */
#bg-layer::after {
content: '';
position: absolute;
inset: 0;
background: rgba(0, 0, 0, 0.12);
pointer-events: none;
}

/* ---------- 浮动光晕 ---------- */
.glow {
position: fixed;
border-radius: 50%;
filter: blur(100px);
pointer-events: none;
z-index: 1;
opacity: 0.18;
}
.glow-1 {
width: 500px;
height: 500px;
background: #3b82f6;
top: -200px;
right: -100px;
animation: floatGlow 20s ease-in-out infinite alternate;
}
.glow-2 {
width: 400px;
height: 400px;
background: #8b5cf6;
bottom: -150px;
left: -100px;
animation: floatGlow 25s ease-in-out infinite alternate-reverse;
}

@keyframes floatGlow {
0% { transform: translate(0, 0) scale(1); }
100% { transform: translate(50px, 40px) scale(1.2); }
}

/* ---------- 卡片容器 ---------- */
.card-wrapper {
position: relative;
z-index: 10;
width: 100%;
max-width: 620px;
perspective: 1200px;
}

.card {
background: rgba(12, 18, 38, 0.45);
backdrop-filter: blur(10px) saturate(1.3);
-webkit-backdrop-filter: blur(10px) saturate(1.3);
border-radius: 48px;
padding: 36px 34px 44px;
box-shadow:
0 40px 100px rgba(0, 0, 0, 0.55),
0 0 0 1px rgba(255, 255, 255, 0.06),
inset 0 1px 0 rgba(255, 255, 255, 0.08);
border: 1px solid rgba(255, 255, 255, 0.04);
transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.4s ease;
position: relative;
overflow: hidden;
}

.card:hover {
transform: translateY(-4px) scale(1.005);
box-shadow: 0 50px 120px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
}

/* 顶部流光线条 */
.card::before {
content: '';
position: absolute;
top: 0;
left: 0;
right: 0;
height: 3px;
background: linear-gradient(90deg, transparent, #60a5fa, #a78bfa, #60a5fa, transparent);
background-size: 300% 100%;
opacity: 0.8;
animation: shimmer 8s linear infinite;
}

@keyframes shimmer {
0% { background-position: -300% 0; }
100% { background-position: 300% 0; }
}

/* ---------- 卡片头部（左上横排） ---------- */
.card-header {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 24px;
position: relative;
z-index: 2;
}

.badge {
display: inline-flex;
align-items: center;
gap: 8px;
background: rgba(255, 255, 255, 0.06);
backdrop-filter: blur(4px);
padding: 6px 16px 6px 12px;
border-radius: 100px;
border: 1px solid rgba(255, 255, 255, 0.06);
font-size: 12px;
font-weight: 600;
letter-spacing: 0.04em;
color: rgba(255, 255, 255, 0.6);
text-transform: uppercase;
}

.badge svg {
width: 14px;
height: 14px;
stroke: currentColor;
stroke-width: 2;
fill: none;
}

.counter {
font-size: 13px;
font-weight: 500;
color: rgba(255, 255, 255, 0.4);
background: rgba(255, 255, 255, 0.04);
padding: 4px 14px;
border-radius: 100px;
border: 1px solid rgba(255, 255, 255, 0.04);
letter-spacing: 0.02em;
font-variant-numeric: tabular-nums;
white-space: nowrap;
}

/* ---------- 竖排四列 ---------- */
.vertical-cols {
position: relative;
z-index: 2;
display: flex;
flex-direction: row;
align-items: flex-start;
justify-content: center;
gap: 16px;
min-height: 240px;
padding: 14px 0 6px;
--col-font: clamp(24px, 4.6vw, 38px);
}

.vbox {
writing-mode: vertical-rl;
white-space: nowrap;
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.07);
border-radius: 16px;
padding: 18px 12px;
font-size: var(--col-font);
font-weight: 700;
line-height: 1.35;
letter-spacing: 0.06em;
color: #f1f5f9;
text-shadow: 0 2px 16px rgba(0, 0, 0, 0.35);
opacity: 0;
animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.vbox:nth-child(2) { animation-delay: 0.1s; }
.vbox:nth-child(3) { animation-delay: 0.2s; }
.vbox:nth-child(4) { animation-delay: 0.3s; }

/* 编号列 */
.vbox-num {
font-size: clamp(17px, 2.8vw, 22px);
font-weight: 700;
text-orientation: upright;
color: #a5b4fc;
background: rgba(99, 102, 241, 0.14);
border-color: rgba(99, 102, 241, 0.2);
padding: 14px 10px;
letter-spacing: 0.05em;
}

/* 下半句列略淡 */
.vbox-sub {
color: #cbd5e1;
}

/* ⚡青春列 */
.vbox-tag {
display: flex;
flex-direction: column;
align-items: center;
gap: 10px;
writing-mode: horizontal-tb;
background: rgba(99, 102, 241, 0.08);
border-color: rgba(99, 102, 241, 0.12);
padding: 14px 9px;
}

.vbox-tag svg {
width: 16px;
height: 16px;
fill: #facc15;
flex-shrink: 0;
}

.vbox-tag span {
writing-mode: vertical-rl;
white-space: nowrap;
font-size: 12px;
font-weight: 500;
line-height: 1.4;
letter-spacing: 0.08em;
color: rgba(255, 255, 255, 0.55);
text-shadow: none;
}

@keyframes fadeUp {
0% { opacity: 0; transform: translateY(18px); }
100% { opacity: 1; transform: translateY(0); }
}

/* ---------- 底部操作栏（保持不变） ---------- */
.card-actions {
display: flex;
align-items: center;
justify-content: space-between;
margin-top: 22px;
padding-top: 18px;
border-top: 1px solid rgba(255, 255, 255, 0.04);
flex-wrap: wrap;
gap: 12px;
opacity: 0;
animation: fadeUp 0.8s 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.action-group {
display: flex;
gap: 8px;
}

.btn {
display: inline-flex;
align-items: center;
justify-content: center;
gap: 8px;
padding: 10px 20px;
border-radius: 100px;
font-size: 13px;
font-weight: 600;
background: rgba(255, 255, 255, 0.04);
color: rgba(255, 255, 255, 0.55);
border: 1px solid rgba(255, 255, 255, 0.04);
cursor: pointer;
transition: all 0.25s ease;
backdrop-filter: blur(4px);
text-decoration: none;
font-family: inherit;
letter-spacing: 0.01em;
user-select: none;
}

.btn:hover {
background: rgba(255, 255, 255, 0.08);
color: #f1f5f9;
border-color: rgba(255, 255, 255, 0.08);
transform: translateY(-2px);
}

.btn:active {
transform: scale(0.95);
}

.btn-primary {
background: rgba(99, 102, 241, 0.15);
color: #a5b4fc;
border-color: rgba(99, 102, 241, 0.12);
}
.btn-primary:hover {
background: rgba(99, 102, 241, 0.25);
color: #c7d2fe;
border-color: rgba(99, 102, 241, 0.2);
}

.btn-icon {
width: 42px;
height: 42px;
padding: 0;
border-radius: 100px;
font-size: 16px;
}

.btn svg {
width: 16px;
height: 16px;
stroke: currentColor;
stroke-width: 2;
fill: none;
flex-shrink: 0;
}

.btn-share {
background: rgba(56, 189, 248, 0.08);
color: #7dd3fc;
border-color: rgba(56, 189, 248, 0.06);
}
.btn-share:hover {
background: rgba(56, 189, 248, 0.18);
color: #bae6fd;
}

/* ---------- Toast ---------- */
.toast {
position: fixed;
bottom: 30px;
left: 50%;
transform: translateX(-50%) translateY(100px);
background: rgba(15, 23, 42, 0.9);
backdrop-filter: blur(20px);
padding: 12px 28px;
border-radius: 100px;
border: 1px solid rgba(255, 255, 255, 0.06);
color: #e2e8f0;
font-size: 14px;
font-weight: 500;
box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
z-index: 999;
opacity: 0;
transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
pointer-events: none;
white-space: nowrap;
}

.toast.show {
opacity: 1;
transform: translateX(-50%) translateY(0);
}

/* ---------- 响应式 ---------- */
@media (max-width: 480px) {
.card {
padding: 24px 18px 28px;
border-radius: 32px;
}
.vertical-cols {
gap: 10px;
min-height: 200px;
padding: 10px 0 4px;
--col-font: clamp(20px, 5.6vw, 27px);
}
.vbox {
padding: 12px 8px;
border-radius: 12px;
line-height: 1.3;
}
.vbox-num {
font-size: 14px;
padding: 10px 7px;
}
.vbox-tag {
padding: 10px 6px;
gap: 8px;
}
.vbox-tag span {
font-size: 11px;
line-height: 1.35;
}
.card-actions {
flex-direction: column;
align-items: stretch;
margin-top: 16px;
}
.action-group {
justify-content: center;
flex-wrap: wrap;
}
.btn {
padding: 8px 14px;
font-size: 12px;
}
.counter {
font-size: 11px;
padding: 2px 10px;
}
.badge {
font-size: 10px;
padding: 4px 12px 4px 10px;
}
}

@media (max-width: 380px) {
.card {
padding: 18px 14px 22px;
border-radius: 26px;
}
.vbox {
font-size: 19px;
}
}
</style>
</head>
<body>

<!-- 背景层 -->
<div id="bg-layer"></div>

<!-- 浮动光晕 -->
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<!-- Toast -->
<div id="toast" class="toast">已复制到剪贴板</div>

<!-- 卡片 -->
<div class="card-wrapper">
<div class="card" id="card" role="article" aria-label="青春寄语卡片">

<div class="card-header">
<span class="badge">
<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
<path d="M12 2L2 7l10 5 10-5-10-5z" />
<path d="M2 17l10 5 10-5" />
<path d="M2 12l10 5 10-5" />
</svg>
致新机电人
</span>
<span class="counter" id="counter">1 / 5</span>
</div>

<!-- 竖排四列：编号 / 上句 / 下句 / ⚡青春 -->
<div class="vertical-cols" id="vCols"></div>

<div class="card-actions">
<div class="action-group">
<button class="btn btn-icon btn-random" id="randomBtn" aria-label="随机切换" title="随机一条">
<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
<polyline points="21 4 21 10 15 10" />
<path d="M21 10a9 9 0 0 1-15.6 5.6" />
<polyline points="3 20 3 14 9 14" />
<path d="M3 14a9 9 0 0 1 15.6-5.6" />
</svg>
</button>
<button class="btn btn-primary btn-icon" id="shareBtn" aria-label="分享" title="复制链接">
<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
<circle cx="18" cy="5" r="3" />
<circle cx="6" cy="12" r="3" />
<circle cx="18" cy="19" r="3" />
<line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
<line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
</svg>
</button>
</div>
<div class="action-group">
<button class="btn btn-share" id="prevBtn">
<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
<polyline points="15 18 9 12 15 6" />
</svg>
上一条
</button>
<button class="btn btn-share" id="nextBtn">
下一条
<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
<polyline points="9 6 15 12 9 18" />
</svg>
</button>
</div>
</div>

</div>
</div>

<script>
// ================================================================
// 寄语数据（5条，编号为素材原文序号）
// ================================================================
const ITEMS = /*__DATA__*/[
 {
  "num": 26,
  "text": "你的大学，是一块未编程的芯片，等待写入无限可能"
 },
 {
  "num": 27,
  "text": "不要做被动的接收器，要做主动的发射塔"
 },
 {
  "num": 28,
  "text": "把焦虑交给风，把专注留给手"
 },
 {
  "num": 29,
  "text": "每一个清晨，都是你重新定义自己的机会"
 },
 {
  "num": 30,
  "text": "成长如登山，每一步都算数，每一米都值得"
 }
];

// ================================================================
// 核心逻辑
// ================================================================
const TOTAL = ITEMS.length;
let currentIndex = 0;

const vColsEl = document.getElementById('vCols');
const counterEl = document.getElementById('counter');
const randomBtn = document.getElementById('randomBtn');
const shareBtn = document.getElementById('shareBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const toast = document.getElementById('toast');

// 从 URL 获取卡片序号
function getIndexFromURL() {
const params = new URLSearchParams(window.location.search);
const id = parseInt(params.get('id'), 10);
if (!isNaN(id) && id >= 1 && id <= TOTAL) return id - 1;
return -1;
}

// 以逗号为分界，切为上下两句
function splitLines(text) {
const idx = text.indexOf('，');
if (idx === -1) return { line1: text, line2: '' };
return {
line1: text.slice(0, idx + 1),
line2: text.slice(idx + 1)
};
}

// 渲染一张卡片（竖排四列）
function renderBlessing(index) {
index = Math.max(0, Math.min(TOTAL - 1, index));
currentIndex = index;

const item = ITEMS[index];
const { line1, line2 } = splitLines(item.text);

// 恢复默认字号（避免继承上一张的缩小值）
vColsEl.style.removeProperty('--col-font');
vColsEl.innerHTML = '';

// 1) 编号列
const numBox = document.createElement('div');
numBox.className = 'vbox vbox-num';
numBox.textContent = '#' + String(item.num).padStart(3, '0');
vColsEl.appendChild(numBox);

// 2) 上半句列
const l1 = document.createElement('div');
l1.className = 'vbox';
l1.textContent = line1;
vColsEl.appendChild(l1);

// 3) 下半句列
if (line2) {
const l2 = document.createElement('div');
l2.className = 'vbox vbox-sub';
l2.textContent = line2;
vColsEl.appendChild(l2);
}

// 4) ⚡青春列
const tagBox = document.createElement('div');
tagBox.className = 'vbox vbox-tag';
const ns = 'http://www.w3.org/2000/svg';
const svg = document.createElementNS(ns, 'svg');
svg.setAttribute('viewBox', '0 0 24 24');
const path = document.createElementNS(ns, 'path');
path.setAttribute('d', 'M13 2L3 14h7l-1 8 10-12h-7l1-8z');
svg.appendChild(path);
const tagSpan = document.createElement('span');
tagSpan.textContent = '青春 · 重庆机电职业技术大学 · 电气与电子工程学院';
tagBox.appendChild(svg);
tagBox.appendChild(tagSpan);
vColsEl.appendChild(tagBox);

counterEl.textContent = `${index + 1} / ${TOTAL}`;

// 长句自适应：列超高时按比例缩小字号，保证一屏放下
fitColumns();

// 重播 actions 动画
const actions = document.querySelector('.card-actions');
if (actions) {
actions.style.animation = 'none';
void actions.offsetHeight;
actions.style.animation = 'fadeUp 0.8s 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards';
}

// 更新 URL
const url = new URL(window.location);
url.searchParams.set('id', String(index + 1));
window.history.replaceState({ index }, '', url);
}

// 长句自适应：若最高列超出可用高度，按比例缩小 --col-font
function fitColumns() {
const cols = vColsEl.querySelectorAll('.vbox');
let tallest = 0;
cols.forEach(c => { tallest = Math.max(tallest, c.offsetHeight); });
if (tallest === 0) return;
// 预留 header / actions / 卡片内边距
const maxCol = Math.max(240, window.innerHeight - 360);
if (tallest > maxCol) {
// 取使用 --col-font 的上句列（第2列）作为字号基准
const ref = vColsEl.querySelectorAll('.vbox')[1];
const cur = parseFloat(getComputedStyle(ref).fontSize);
if (isFinite(cur) && cur > 0) {
const ratio = maxCol / tallest;
const next = Math.max(15, Math.round(cur * ratio * 0.97));
vColsEl.style.setProperty('--col-font', next + 'px');
}
}
}

// 随机
function randomBlessing() {
let newIndex;
do {
newIndex = Math.floor(Math.random() * TOTAL);
} while (newIndex === currentIndex && TOTAL > 1);
renderBlessing(newIndex);
}

// 分享
function shareCurrent() {
const url = new URL(window.location);
url.searchParams.set('id', String(currentIndex + 1));
const shareUrl = url.toString();

if (navigator.clipboard?.writeText) {
navigator.clipboard.writeText(shareUrl)
.then(() => showToast('链接已复制，分享给朋友吧！'))
.catch(() => fallbackCopy(shareUrl));
} else {
fallbackCopy(shareUrl);
}
}

function fallbackCopy(text) {
const ta = document.createElement('textarea');
ta.value = text;
ta.style.position = 'fixed';
ta.style.opacity = '0';
ta.style.left = '-9999px';
document.body.appendChild(ta);
ta.select();
try {
document.execCommand('copy');
showToast('链接已复制');
} catch {
showToast('请手动复制地址栏链接');
}
document.body.removeChild(ta);
}

let toastTimer;

function showToast(msg) {
toast.textContent = msg;
toast.classList.add('show');
clearTimeout(toastTimer);
toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}

// 键盘
document.addEventListener('keydown', (e) => {
if (e.key === 'ArrowLeft') { e.preventDefault(); renderBlessing(currentIndex - 1); }
if (e.key === 'ArrowRight') { e.preventDefault(); renderBlessing(currentIndex + 1); }
if (e.key === 'r' || e.key === 'R') { e.preventDefault(); randomBlessing(); }
});

// 触摸滑动
let touchStartX = 0;
const cardEl = document.getElementById('card');
cardEl.addEventListener('touchstart', (e) => {
touchStartX = e.changedTouches[0].screenX;
}, { passive: true });
cardEl.addEventListener('touchend', (e) => {
const diff = touchStartX - e.changedTouches[0].screenX;
if (Math.abs(diff) > 50) {
renderBlessing(currentIndex + (diff > 0 ? 1 : -1));
}
}, { passive: true });

// 绑定事件
randomBtn.addEventListener('click', randomBlessing);
shareBtn.addEventListener('click', shareCurrent);
prevBtn.addEventListener('click', () => renderBlessing(currentIndex - 1));
nextBtn.addEventListener('click', () => renderBlessing(currentIndex + 1));

// 初始化
const initIndex = getIndexFromURL();
renderBlessing(initIndex >= 0 ? initIndex : Math.floor(Math.random() * TOTAL));

console.log('致新机电人 · 青春寄语（竖排版）');
</script>

</body>
</html>
